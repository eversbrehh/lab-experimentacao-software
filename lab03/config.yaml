# Configuração do pipeline do Lab03. O token do GitHub NÃO fica aqui:
# ele é lido da variável de ambiente GITHUB_TOKEN.

janela:
  inicio: 2025-10-01   # intervalo fechado, datas em UTC
  fim: 2026-09-30

criterios:
  min_releases: 5
  min_workflow_runs: 50

selecao:
  alvo_aprovados: 300  # repositórios aprovados no funil (Sprint 02); 100 na Sprint 01
  consulta_base: "stars:>1000"
  # Faixas de estrelas para contornar o teto de 1.000 resultados por busca,
  # em ordem decrescente; a que passar do teto é estreitada em pipeline/selecao.py
  faixas_estrelas:
    - ">10000"
    - "5000..10000"
    - "2000..5000"
    - "1000..2000"

coleta:
  # Candidatos avaliados e requisições em andamento ao mesmo tempo. Acima de 5 não há
  # ganho: o limite passa a ser a cota de 5.000 requisições por hora do token.
  paralelismo: 5
  # Variantes C2 (release + pré-release) e C3 (tag) da RQ 07. Desligadas, não consultam a API
  # e as dez colunas delas ficam vazias; a execução usa só o cache. Desligadas na Sprint 02
  # (dataset congelado na #168); ligue na Sprint 03 (S03-05), que as coleta.
  variantes_rq07: false

caminhos:
  cache: dados/cache
  saida: dados/saida
